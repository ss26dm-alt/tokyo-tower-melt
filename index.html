<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>東京タワー、溶けます</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&display=swap');

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: linear-gradient(180deg, #FFE9C7 0%, #FFD199 35%, #FFB56B 65%, #FF9A4D 100%);
    transition: background 1.2s ease;
  }

  #sky {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #heat {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      transparent, transparent 2px, rgba(255,255,255,0.02) 3px
    );
    opacity: 0;
    transition: opacity 1s ease;
  }

  .sun {
    position: absolute;
    top: 6%;
    right: 10%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFF3C4, #FF6B35 75%);
    box-shadow: 0 0 60px 20px rgba(255,150,60,0.5);
    animation: pulse 2.4s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* --- danmaku layer (niconico-style scrolling comments) --- */
  #danmaku {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    overflow: hidden;
  }
  .comment {
    position: absolute;
    white-space: nowrap;
    font-weight: 900;
    color: #fff;
    text-shadow:
      -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000,
      -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000,
      0 0 6px rgba(0,0,0,0.4);
    will-change: transform;
    animation: flow linear forwards;
  }
  @keyframes flow {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-100vw - 100%)); }
  }

  #stage {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    height: 70%;
    z-index: 2;
    perspective: 700px;
  }

  #ground {
    position: absolute;
    bottom: 0;
    left: -200px;
    width: 740px;
    height: 40px;
    background: #6b6357;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  #puddleWrap {
    position: absolute;
    bottom: 4px;
    left: 50%;
    width: 340px;
    height: 60px;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .puddle {
    position: absolute;
    bottom: 0;
    border-radius: 50%;
    background: radial-gradient(circle, #ff9548 0%, #e05f0c 65%, transparent 100%);
    opacity: 0;
    filter: blur(1px);
    transition: opacity 0.6s ease, width 0.6s ease, height 0.6s ease, left 0.6s ease;
  }

  #tower {
    position: absolute;
    bottom: 40px;
    left: 50%;
    width: 220px;
    height: 100%;
    transform-origin: bottom center;
    transform: translateX(-50%);
    transition: filter 0.5s ease;
  }

  #tower svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  #label {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    width: 92%;
    max-width: 420px;
  }

  #label h1 {
    font-family: 'Shippori Mincho', serif;
    font-weight: 800;
    font-size: clamp(24px, 7vw, 30px);
    margin: 0;
    color: #5a2e0d;
    letter-spacing: 0.05em;
    text-shadow: 0 2px 0 rgba(255,255,255,0.4);
  }

  #label p {
    margin: 6px 0 0;
    font-size: clamp(14px, 4vw, 16px);
    line-height: 1.5;
    color: #7a3f14;
    font-weight: 600;
  }

  #hud {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 18px 20px 24px;
    background: linear-gradient(0deg, rgba(90,40,10,0.35), transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 380px;
  }

  #tempLabel {
    font-weight: 900;
    font-size: 17px;
    color: #4a2200;
    min-width: 68px;
    text-align: center;
    background: rgba(255,255,255,0.65);
    border-radius: 10px;
    padding: 8px 8px;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    height: 16px;
    border-radius: 999px;
    background: linear-gradient(90deg, #FFD8A8, #FF6B35, #C81E00);
    outline: none;
    touch-action: pan-x;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    border: 5px solid #C81E00;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  input[type=range]::-moz-range-thumb {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    border: 5px solid #C81E00;
    cursor: pointer;
  }

  #resetBtn {
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    background: #4a2200;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    cursor: pointer;
    opacity: 0.85;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  #resetBtn:hover { opacity: 1; }

  #yajiRow {
    max-width: 380px;
  }
  #yajiInput {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 16px;
    font-weight: 500;
    padding: 12px 16px;
    border-radius: 999px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.85);
    color: #4a2200;
  }
  #yajiInput::placeholder { color: #b3835a; }
  #yajiSend {
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
    background: #C81E00;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    opacity: 0.9;
    transition: opacity 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #yajiSend:hover { opacity: 1; }

  #medal {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%) scale(0.6);
    background: #fff8ec;
    border: 3px solid #C81E00;
    border-radius: 20px;
    padding: 28px 26px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: all 0.5s cubic-bezier(.2,1.4,.4,1);
    z-index: 40;
    width: 88%;
    max-width: 300px;
  }
  #medal.show {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
  }
  #medal .badge { font-size: 42px; }
  #medal h2 {
    font-family: 'Shippori Mincho', serif;
    font-size: 21px;
    color: #C81E00;
    margin: 8px 0 6px;
  }
  #medal p {
    font-size: 14.5px;
    line-height: 1.5;
    color: #6b4423;
    margin: 0 0 4px;
  }
  #medal .pattern {
    font-size: 13px;
    color: #a85a1e;
    font-weight: 700;
    margin-top: 8px;
  }
  #medal #resetBtn {
    display: inline-block;
    margin-top: 18px;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div id="sky">
  <div class="sun"></div>
  <div id="heat"></div>
  <div id="danmaku"></div>

  <div id="label">
    <h1>東京タワー、溶けます</h1>
    <p>スライダーで気温を上げるとタワーが限界を迎えます<br>応援のヤジも飛ばしてね</p>
  </div>

  <div id="stage">
    <div id="tower">
      <svg viewBox="0 0 220 480" preserveAspectRatio="none">
        <defs>
          <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FF9F5A"/>
            <stop offset="55%" stop-color="#F1631A"/>
            <stop offset="100%" stop-color="#D64600"/>
          </linearGradient>
          <linearGradient id="whiteGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FDF6EE"/>
            <stop offset="100%" stop-color="#EDE1D2"/>
          </linearGradient>
          <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#C3C9CF"/>
            <stop offset="100%" stop-color="#7C838B"/>
          </linearGradient>
        </defs>

        <!-- ============================================================
             8パーツ構成（下から上）:
             底部トラス下半(bone1) → 底部トラス上半(bone2) → 下展望台(rigid)
             → 中間部トラス下半(bone3) → 中間部トラス上半(bone4)
             → 上展望台・地デジ放送アンテナ・頂部(rigid, deck2Group)
             溶けるのは bone1〜bone4 の4パーツのみ。
             ============================================================ -->
        <g id="bone1" data-pivot-x="110" data-pivot-y="472">
          <g id="bone1Deform">
            <!-- 底部トラス下半（急テーパー・オレンジ） -->
            <polygon points="22,472 198,472 154,379 66,379" fill="url(#towerGrad)"/>
            <g stroke="#B03A00" stroke-width="1.2" fill="none" opacity="0.85">
              <line x1="44" y1="425.5" x2="176" y2="425.5"/>
              <polyline points="22,472 176,425.5 66,379"/>
              <polyline points="198,472 44,425.5 154,379"/>
            </g>
            <g stroke="#4a2200" stroke-width="1.2" fill="none">
              <line x1="22" y1="472" x2="66" y2="379"/>
              <line x1="198" y1="472" x2="154" y2="379"/>
            </g>
          </g>

          <g id="bone2" data-pivot-x="110" data-pivot-y="379">
            <g id="bone2Deform">
              <!-- 底部トラス上半（なだらかテーパー・白） -->
              <polygon points="66,379 154,379 140,285 80,285" fill="url(#whiteGrad)"/>
              <g stroke="#B03A00" stroke-width="1.2" fill="none" opacity="0.85">
                <line x1="73" y1="332" x2="147" y2="332"/>
                <polyline points="66,379 147,332 80,285"/>
                <polyline points="154,379 73,332 140,285"/>
              </g>
              <g stroke="#4a2200" stroke-width="1.2" fill="none">
                <line x1="66" y1="379" x2="80" y2="285"/>
                <line x1="154" y1="379" x2="140" y2="285"/>
                <!-- 下展望台への段差(外形線) -->
                <line x1="80" y1="285" x2="71" y2="285"/>
                <line x1="140" y1="285" x2="149" y2="285"/>
              </g>
            </g>

            <g id="deck1">
              <!-- 下展望台：逆台形（上辺広・下辺短）・グレー金属・剛体 -->
              <polygon points="71,285 149,285 158,261 62,261" fill="url(#deckGrad)" stroke="#5f6368" stroke-width="1.2"/>
            </g>

            <g id="bone3" data-pivot-x="110" data-pivot-y="261">
              <g id="bone3Deform">
                <!-- 中間部トラス下半（オレンジ） -->
                <polygon points="82,261 138,261 133,205 87,205" fill="url(#towerGrad)"/>
                <g stroke="#B03A00" stroke-width="1.1" fill="none" opacity="0.85">
                  <line x1="84.5" y1="233" x2="135.5" y2="233"/>
                  <polyline points="82,261 135.5,233 87,205"/>
                  <polyline points="138,261 84.5,233 133,205"/>
                </g>
                <g stroke="#4a2200" stroke-width="1.1" fill="none">
                  <line x1="82" y1="261" x2="87" y2="205"/>
                  <line x1="138" y1="261" x2="133" y2="205"/>
                  <!-- 下展望台からの段差(外形線) -->
                  <line x1="62" y1="261" x2="82" y2="261"/>
                  <line x1="158" y1="261" x2="138" y2="261"/>
                </g>
              </g>

              <g id="bone4" data-pivot-x="110" data-pivot-y="205">
                <g id="bone4Deform">
                  <!-- 中間部トラス上半（白） -->
                  <polygon points="87,205 133,205 128,149 92,149" fill="url(#whiteGrad)"/>
                  <g stroke="#B03A00" stroke-width="1.1" fill="none" opacity="0.85">
                    <line x1="89.5" y1="177" x2="130.5" y2="177"/>
                    <polyline points="87,205 130.5,177 92,149"/>
                    <polyline points="133,205 89.5,177 128,149"/>
                  </g>
                  <g stroke="#4a2200" stroke-width="1.1" fill="none">
                    <line x1="87" y1="205" x2="92" y2="149"/>
                    <line x1="133" y1="205" x2="128" y2="149"/>
                  </g>
                </g>

                <g id="deck2Group">
                  <!-- 上展望台：薄い円盤（側面）・グレー金属・剛体 -->
                  <ellipse cx="110" cy="142.5" rx="35" ry="7" fill="url(#deckGrad)" stroke="#5f6368" stroke-width="1.2"/>

                  <!-- 地デジ放送アンテナ：円柱、オレンジ・白×2周縞・剛体 -->
                  <rect x="82" y="126.75" width="56" height="9.25" fill="url(#towerGrad)"/>
                  <rect x="82" y="117.5" width="56" height="9.25" fill="url(#whiteGrad)"/>
                  <rect x="82" y="108.25" width="56" height="9.25" fill="url(#towerGrad)"/>
                  <rect x="82" y="99" width="56" height="9.25" fill="url(#whiteGrad)"/>
                  <rect x="82" y="99" width="56" height="37" fill="none" stroke="#5f6368" stroke-width="1.2"/>

                  <!-- 頂部：下は円柱、先端だけ絞る・オレンジ・剛体 -->
                  <rect x="100" y="47" width="20" height="52" fill="url(#towerGrad)" stroke="#B03A00" stroke-width="1.2"/>
                  <polygon points="100,47 120,47 110,25" fill="url(#towerGrad)" stroke="#B03A00" stroke-width="1.2"/>
                  <circle cx="110" cy="25" r="2.2" fill="#FFD23F"/>
                </g>
              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
    <div id="puddleWrap">
      <div class="puddle" id="p1"></div>
      <div class="puddle" id="p2"></div>
      <div class="puddle" id="p3"></div>
    </div>
    <div id="ground"></div>
  </div>

  <div id="hud">
    <div class="controls">
      <span id="tempLabel">28℃</span>
      <input type="range" id="tempSlider" min="28" max="60" value="28" step="1">
    </div>
    <div class="controls" id="yajiRow">
      <input type="text" id="yajiInput" placeholder="ヤジを飛ばす…" maxlength="20">
      <button id="yajiSend">送信</button>
    </div>
  </div>

  <div id="medal">
    <div class="badge">🏅</div>
    <h2>東京タワー溶解マイスター</h2>
    <p>おめでとうございます。あなたは東京タワーを完全に液状化させました。この称号は誰の役にも立ちません。</p>
    <div class="pattern" id="patternResult"></div>
    <button id="resetBtn">冷やす（やり直す）</button>
  </div>
</div>

<script>
  const slider = document.getElementById('tempSlider');
  const tempLabel = document.getElementById('tempLabel');
  const tower = document.getElementById('tower');
  const danmaku = document.getElementById('danmaku');
  const heat = document.getElementById('heat');
  const medal = document.getElementById('medal');
  const patternResult = document.getElementById('patternResult');
  const resetBtn = document.getElementById('resetBtn');
  const yajiInput = document.getElementById('yajiInput');
  const yajiSend = document.getElementById('yajiSend');
  const body = document.body;
  const puddles = [document.getElementById('p1'), document.getElementById('p2'), document.getElementById('p3')];

  /* ---------- melt "personality" — randomized each run ---------- */
  const PATTERNS = [
    { key: 'left',      label: '右くねくねタイプ', skewSign: 1,  squashBias: 1.0,  wobble: 1.0 },
    { key: 'right',     label: '左くねくねタイプ', skewSign: -1, squashBias: 1.0,  wobble: 1.0 },
    { key: 'slump',     label: 'ベシャッと潰れタイプ', skewSign: 0,  squashBias: 1.5,  wobble: 0.3 },
    { key: 'curveLeft', label: '右に曲がって崩れるタイプ', skewSign: 1, squashBias: 0.9, wobble: 0.6 },
    { key: 'curveRight', label: '左に曲がって崩れるタイプ', skewSign: -1, squashBias: 0.9, wobble: 0.6 },
    { key: 'front',      label: '手前に倒れるタイプ', skewSign: 0, squashBias: 1.0, wobble: 0.4 },
    { key: 'back',       label: '奥に倒れるタイプ', skewSign: 0, squashBias: 1.0, wobble: 0.4 },
  ];

  // 4本の溶解ボーン(底部下半→底部上半→中間下半→中間上半、根本から先端の順)
  // 各ボーンは「自分の見た目(Deform)」と「剛体の子要素(展望台等)」を内包する入れ子構造。
  const boneEls = ['bone1', 'bone2', 'bone3', 'bone4'].map(id => document.getElementById(id));
  const deformEls = ['bone1Deform', 'bone2Deform', 'bone3Deform', 'bone4Deform'].map(id => document.getElementById(id));
  // 剛体パーツ(展望台・アンテナ・頂部)：形は崩れず、にじみ演出のみ加える
  const rigidEls = [document.getElementById('deck1'), document.getElementById('deck2Group')];

  let pattern = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
  let seed = Math.random() * 1000;

  /* ---------- niconico-style danmaku comments ---------- */
  const commentBank = {
    early: [
      "まだいけるいける", "余裕そう", "序盤オツ", "今日も暑いね〜",
      "見てるだけで暑い", "wwww", "はじまた", "同接すごい", "888888"
    ],
    mid: [
      "あっ…", "ちょっと待って", "曲がってきたｗ", "これはやばい",
      "実況が忙しい", "オイオイオイ", "香ばしくなってきた", "溶解不可避",
      "誰か止めて", "草生える", "まって熱すぎん？", "これは事故"
    ],
    late: [
      "限界突破", "耐えて〜！！！", "アーッ", "ｷﾀ━━━(ﾟ∀ﾟ)━━━!!",
      "もう団子じゃん", "www原型ない", "祭りだ", "実質新作アート",
      "誰がこんな気温にした", "犯人この中にいる", "尊死"
    ],
    end: [
      "溶解おめでとう🎉", "完走お疲れ様でした", "伝説の回", "また溶かそう",
      "GJ", "神回", "これは殿堂入り", "8888888888"
    ]
  };

  function pickComment(t) {
    let pool;
    if (t < 36) pool = commentBank.early;
    else if (t < 46) pool = commentBank.mid;
    else if (t < 59) pool = commentBank.late;
    else pool = commentBank.end;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawnComment(text, isOwn) {
    const el = document.createElement('div');
    el.className = 'comment';
    el.textContent = text;
    const fontSize = isOwn ? 26 + Math.random() * 6 : 17 + Math.random() * 15;
    el.style.fontSize = fontSize + 'px';
    if (isOwn) {
      el.style.color = '#FFE44D';
      el.style.top = (10 + Math.random() * 30) + '%';
    } else {
      el.style.top = (Math.random() * 82) + '%';
    }
    el.style.left = '100%';
    const duration = isOwn ? 5.5 : 4.5 + Math.random() * 3.5;
    el.style.animationDuration = duration + 's';
    danmaku.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000 + 200);
  }

  let danmakuTimer = null;
  function startDanmaku(intensityFn) {
    stopDanmaku();
    const tick = () => {
      const t = parseInt(slider.value, 10);
      spawnComment(pickComment(t));
      const interval = Math.max(220, 900 - (t - 28) * 24 + Math.random() * 300);
      danmakuTimer = setTimeout(tick, interval);
    };
    tick();
  }
  function stopDanmaku() {
    if (danmakuTimer) clearTimeout(danmakuTimer);
    danmakuTimer = null;
  }

  // own yaji keeps recurring on its own timer, independent of the random
  // comment stream, until the user resets (cools the tower down)
  let ownYajiList = [];
  let ownYajiTimer = null;
  function startOwnYajiLoop() {
    stopOwnYajiLoop();
    const tick = () => {
      if (ownYajiList.length > 0) {
        const idx = Math.floor(Math.random() * ownYajiList.length);
        spawnComment(ownYajiList[idx], true);
      }
      ownYajiTimer = setTimeout(tick, 3200 + Math.random() * 2200);
    };
    ownYajiTimer = setTimeout(tick, 3200 + Math.random() * 2200);
  }
  function stopOwnYajiLoop() {
    if (ownYajiTimer) clearTimeout(ownYajiTimer);
    ownYajiTimer = null;
  }

  function update() {
    const t = parseInt(slider.value, 10);
    tempLabel.textContent = t + '℃';

    const progress = Math.min(1, Math.max(0, (t - 28) / (60 - 28)));

    // base melt math, modulated by chosen pattern + a per-run seed for organic variation
    const wobble = Math.sin(progress * 6 + seed) * pattern.wobble;
    const blur = progress * 3.2;
    const droop = progress * (pattern.key === 'slump' ? 55 : 40);

    // reset bone/deform transforms every frame before re-applying the current pattern
    boneEls.forEach(el => el && el.removeAttribute('transform'));
    deformEls.forEach(el => el && el.removeAttribute('transform'));

    if (pattern.key === 'curveLeft' || pattern.key === 'curveRight') {
      // curved bend: base barely moves, each bone above adds more lean,
      // producing a smooth C-curve. Rotation is a rigid transform, so the
      // rigid decks/antenna/tip riding on top of each bone stay undeformed.
      tower.style.transform = `translateX(-50%) translateY(${droop * 0.5}px)`;
      tower.style.filter = `blur(${blur}px) saturate(${1 + progress * 0.6})`;

      const boneWeights = [0.05, 0.22, 0.5, 1.0]; // base -> tip lean weight
      const maxBendDeg = 62;
      boneEls.forEach((el, i) => {
        if (!el) return;
        const px = el.dataset.pivotX;
        const py = el.dataset.pivotY;
        // multiplied by progress so the wobble amplitude is exactly 0 at
        // progress=0 — otherwise the random seed can leave the tower
        // slightly crooked even at 28℃ (rest pose).
        const localWobble = Math.sin(progress * 5 + seed + i) * pattern.wobble * 2 * progress;
        const angle = pattern.skewSign * (progress * maxBendDeg * boneWeights[i] + localWobble);
        el.setAttribute('transform', `rotate(${angle}, ${px}, ${py})`);
      });
    } else if (pattern.key === 'front' || pattern.key === 'back') {
      // topple toward (front) or away from (back) the viewer using a 3D
      // rotation around the base. This is applied uniformly to the whole
      // #tower element, so it's a rigid transform (rotate + uniform scale)
      // that doesn't distort the rigid deck/antenna/tip parts.
      const fallDeg = progress * 78;
      const wobbleDeg = Math.sin(progress * 5 + seed) * 3 * progress;
      const rotateX = pattern.key === 'front' ? -fallDeg : fallDeg;

      const frontEase = Math.pow(progress, 1.8);
      const depthScale = pattern.key === 'front'
        ? 1 + frontEase * 1.6
        : 1 - progress * 0.3;

      let shakeX = 0, shakeY = 0;
      if (pattern.key === 'front' && progress > 0.7) {
        const shakeAmt = (progress - 0.7) / 0.3;
        shakeX = (Math.random() - 0.5) * shakeAmt * 14;
        shakeY = (Math.random() - 0.5) * shakeAmt * 10;
      }
      const extraDrop = pattern.key === 'front' ? frontEase * 60 : 0;

      tower.style.transform =
        `translateX(calc(-50% + ${shakeX}px)) translateY(${droop * 0.4 + extraDrop + shakeY}px) scale(${depthScale}) rotateX(${rotateX}deg) rotateZ(${wobbleDeg}deg)`;
      tower.style.filter = pattern.key === 'back'
        ? `blur(${blur + progress * 2}px) saturate(${1 + progress * 0.3}) opacity(${1 - progress * 0.35})`
        : `blur(${blur * 0.4}px) saturate(${1 + progress * 0.8}) brightness(${1 + frontEase * 0.15})`;

      // slight bone wobble on top segments only, for an organic wonky feel
      // (rotation only, so rigid parts stay rigid)
      const boneWeights = [0, 0.08, 0.2, 0.4];
      boneEls.forEach((el, i) => {
        if (!el) return;
        const px = el.dataset.pivotX;
        const py = el.dataset.pivotY;
        // multiplied by progress for the same reason as above: keeps the
        // tower perfectly upright at progress=0 regardless of the seed.
        const localWobble = Math.sin(progress * 6 + seed + i * 1.3) * pattern.wobble * boneWeights[i] * 10 * progress;
        el.setAttribute('transform', `rotate(${localWobble}, ${px}, ${py})`);
      });
    } else {
      // left / right / slump: lean+zigzag is driven entirely by bone
      // ROTATION (same mechanism as the curve patterns above), because
      // rotation is a rigid transform — it carries the whole subtree
      // (rigid decks/antenna/tip AND every bone above it) along with it,
      // so there's no seam between segments. Squash/widen (the actual
      // "melting" look) is applied only to each bone's own Deform
      // sub-group, anchored at its pivot. Shrinking a segment's height
      // would normally leave everything above it floating in its old
      // (taller) position, so each bone also gets a downward translate
      // equal to the height it lost to squash, keeping the chain visually
      // attached all the way up.
      tower.style.transform = `translateX(-50%)`;
      tower.style.filter = `blur(${blur}px) saturate(${1 + progress * 0.6})`;

      const boneWeights = [0.08, 0.25, 0.55, 1.0];
      const segmentHeights = [93, 94, 56, 56]; // bone1..bone4 own Deform height at rest
      const maxLeanDeg = pattern.key === 'slump' ? 0 : 26;

      boneEls.forEach((el, i) => {
        if (!el) return;
        const w = boneWeights[i];
        const px = el.dataset.pivotX;
        const py = el.dataset.pivotY;

        // zigzag: phase-shifted per bone index (i*2.2) so neighbouring
        // segments kink differently from each other, layered on top of a
        // shared lean direction — reads as "jagged" without ever breaking
        // the chain (it's still just a rotation).
        // multiplied by progress so the tower is exactly upright at 28℃
        // (progress=0) no matter what the random seed happens to be.
        const zigzag = Math.sin(progress * 5 + seed + i * 2.2) * pattern.wobble * 9 * w * progress;
        const angle = pattern.skewSign * progress * maxLeanDeg * w + zigzag;
        const leanShift = pattern.key === 'slump' ? 0 : pattern.skewSign * progress * 4 * w;

        const deformEl = deformEls[i];
        let localSquash = 1;
        if (deformEl) {
          localSquash = Math.max(0.3, 1 - progress * 0.75 * pattern.squashBias * w);
          const localWiden = 1 + progress * (pattern.key === 'slump' ? 0.7 : 0.22) * w;
          // scale has no built-in center point (unlike rotate(a,cx,cy)), so
          // it must be anchored manually at this segment's own pivot —
          // otherwise SVG scales relative to the (0,0) origin and the
          // segment jumps to a wildly different position.
          deformEl.setAttribute('transform',
            `translate(${px},${py}) scale(${localWiden}, ${localSquash}) translate(${-px},${-py})`);
        }
        const compensateY = segmentHeights[i] * (1 - localSquash);

        // rigid motion for this bone (and everything nested in it, incl.
        // the next bone and any rigid deck/antenna/tip children): rotate
        // for lean+zigzag, plus a downward shift so it follows the melt
        // below it instead of floating above it.
        el.setAttribute('transform', `translate(${leanShift},${compensateY}) rotate(${angle}, ${px}, ${py})`);
      });
    }

    // rigid parts (decks / antenna / tip) don't deform, but they do get a
    // subtle blur-based "にじみ" (bleeding) treatment as the temperature rises
    const rigidBlur = progress * 1.4;
    rigidEls.forEach(el => { if (el) el.style.filter = `blur(${rigidBlur}px)`; });

    // puddles: for lean patterns, puddle pools toward the lean direction
    const leanOffset = pattern.key === 'slump' ? 0 : pattern.skewSign * progress * 70;
    const baseWidth = 50 + progress * 150;
    const spreadPositions = [
      { off: leanOffset - baseWidth * 0.35, scale: 1.0 },
      { off: leanOffset,                     scale: 1.3 },
      { off: leanOffset + baseWidth * 0.4,   scale: 0.8 },
    ];
    puddles.forEach((p, i) => {
      const sp = spreadPositions[i];
      const w = baseWidth * sp.scale;
      const h = (18 + progress * 26) * sp.scale;
      p.style.width = w + 'px';
      p.style.height = h + 'px';
      p.style.left = `calc(50% + ${sp.off}px - ${w/2}px)`;
      p.style.opacity = progress > 0.12 ? Math.min(0.95, (progress - 0.12) * 1.5) : 0;
    });

    heat.style.opacity = progress * 0.6;

    const bgStops = [
      `#FFE9C7 0%`,
      `#FFD199 35%`,
      `#FF9A4D ${65 - progress * 20}%`,
      `hsl(${18 - progress * 12}, 90%, ${58 - progress * 18}%) 100%`
    ];
    body.style.background = `linear-gradient(180deg, ${bgStops.join(',')})`;

    if (t >= 60) {
      patternResult.textContent = `今回の溶け方：${pattern.label}`;
      medal.classList.add('show');
    } else {
      medal.classList.remove('show');
    }
  }

  slider.addEventListener('input', update);

  resetBtn.addEventListener('click', () => {
    slider.value = 28;
    // reroll the melt personality each time, per request
    pattern = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
    seed = Math.random() * 1000;
    yajiInput.value = '';
    ownYajiList = []; // stop repeating past yaji once the tower is reset
    update();
  });

  function sendYaji() {
    const text = yajiInput.value.trim();
    if (!text) return;
    spawnComment(text, true);
    if (!ownYajiList.includes(text)) {
      ownYajiList.push(text);
      if (ownYajiList.length > 6) ownYajiList.shift(); // keep it bounded
    }
    yajiInput.value = '';
  }
  yajiSend.addEventListener('click', sendYaji);
  yajiInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendYaji();
  });

  update();
  startDanmaku();
  startOwnYajiLoop();
</script>
</body>
</html>
